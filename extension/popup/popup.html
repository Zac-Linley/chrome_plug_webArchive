<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="setup-hint" class="setup-hint" hidden>
      <p>还没有配置 GitHub 仓库，收藏功能用不了。</p>
      <button id="goto-settings" class="primary">去设置</button>
    </div>

    <form id="save-form" hidden>
      <header class="header">
        <span class="title">收藏此页</span>
        <button type="button" id="open-repo" class="link" title="打开数据仓库">仓库 ↗</button>
      </header>

      <label class="field">
        <span>标题</span>
        <input id="title" type="text" placeholder="页面标题" />
      </label>

      <label class="field">
        <span>链接</span>
        <input id="url" type="text" readonly />
      </label>

      <label class="field">
        <span>文件夹</span>
        <div class="combo">
          <input id="folder" type="text" placeholder="如：技术/前端（可留空）" />
          <button type="button" class="arrow" id="folder-arrow" title="选择已有文件夹">▾</button>
          <div class="dropdown" id="folder-dropdown" hidden></div>
        </div>
        <div id="folder-suggest" class="suggest" hidden></div>
      </label>

      <label class="field">
        <span>标签</span>
        <div class="combo">
          <input id="tags" type="text" placeholder="逗号分隔，如：前端, 教程" />
          <button type="button" class="arrow" id="tags-arrow" title="选择已有标签">▾</button>
          <div class="dropdown" id="tags-dropdown" hidden></div>
        </div>
        <div id="tag-suggest" class="suggest" hidden></div>
      </label>

      <label class="field">
        <span>备注</span>
        <textarea id="note" rows="2" placeholder="选填"></textarea>
      </label>

      <button id="save" type="submit" class="primary">保存</button>
      <p id="suggest-hint" class="hint" hidden>建议暂不可用：检查网络或设置里的 token</p>
      <p id="status" class="status" role="status"></p>

      <footer class="footer">
        <button type="button" id="open-settings" class="link">设置</button>
      </footer>
    </form>

    <script type="module" src="popup.js"></script>
  </body>
</html>
