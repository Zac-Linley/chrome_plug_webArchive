<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>书签库</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon128.png" />
    <link rel="apple-touch-icon" href="/icons/icon128.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="header">
      <div>
        <h1>📚 书签库</h1>
        <p class="meta"><span id="count">…</span> · <span id="updated">…</span></p>
      </div>
      <button id="refresh" class="refresh" title="刷新">刷新</button>
    </header>

    <div class="toolbar">
      <input
        id="search"
        type="search"
        placeholder="搜索标题、链接、标签、备注…"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <select id="sort" title="排序">
        <option value="recent">最近添加</option>
        <option value="updated">最近更新</option>
        <option value="title">按标题</option>
      </select>
      <select id="folder-filter" title="文件夹">
        <option value="">全部文件夹</option>
      </select>
    </div>

    <div id="tags" class="tags"></div>
    <main id="results" class="results"></main>
    <p id="empty" class="empty" hidden>没有匹配的书签</p>

    <footer class="footer">
      数据来自你的 GitHub 私有仓库 ·
      <a id="repo-link" href="#" target="_blank" rel="noreferrer">打开仓库</a>
    </footer>

    <script src="/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
      }
    </script>
  </body>
</html>
